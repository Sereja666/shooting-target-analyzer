# Сервер в локальной сети: HTTPS через Caddy с собственным сертификатом.
# Без HTTPS браузер не даст вебку странице, открытой не с localhost.
# В .env рядом: SITE_ADDRESS (IP или имя сервера), SECRET_KEY, POSTGRES_PASSWORD.
# Caddy в сети хоста: на сервере входящий трафик из LAN может маршрутизироваться
# в VPN, и проброс порта в контейнер до него не доходит. Порт 80 не занимается.
services:
  web:
    # Сборка через сеть хоста: на сервере DNS из daemon.json для контейнеров может быть недоступен.
    build:
      network: host
    ports: !override
      - "127.0.0.1:${WEB_LOCAL_PORT:-18080}:8080"
    environment:
      COOKIE_SECURE: "1"
    command:
      - uvicorn
      - web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?укажите SITE_ADDRESS в .env}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      UPSTREAM: 127.0.0.1:${WEB_LOCAL_PORT:-18080}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy-sites:/etc/caddy/sites:ro
      - shottracker-caddy:/data
    depends_on:
      - web

volumes:
  shottracker-caddy:

# Веб-версия: http://localhost:8080
# Запуск: docker compose -f docker-compose.web.yml up -d --build
# На сервере с HTTPS: docker compose -f docker-compose.web.yml -f docker-compose.server.yml up -d --build
# Десктопное окно — отдельный файл docker-compose.yml, порт 6080.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shottracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shottracker}
      POSTGRES_DB: shottracker
      TZ: Europe/Moscow
    volumes:
      - shottracker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shottracker -d shottracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - shottracker-seaweed:/data
      - ./docker/seaweed-s3.json:/etc/seaweedfs/s3.json:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: shottracker-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://shottracker:${POSTGRES_PASSWORD:-shottracker}@postgres:5432/shottracker
      SECRET_KEY: ${SECRET_KEY:-dev-shottracker-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: shottracker
      S3_SECRET_KEY: shottracker-secret
      S3_BUCKET: shottracker
      TZ: Europe/Moscow
    volumes:
      - ./web:/app/web
      - ./shottracker:/app/shottracker
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    command:
      - uvicorn
      - web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/web
      - --reload-dir
      - /app/shottracker

volumes:
  shottracker-pg:
  shottracker-seaweed:

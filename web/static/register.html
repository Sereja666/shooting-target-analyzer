<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — ShotTracker</title>
  <link rel="stylesheet" href="/static/fonts.css?v=3">
  <link rel="stylesheet" href="/static/auth.css?v=3">
</head>
<body>
  <section class="hero sunset-bg">
    <div class="badge"><b>Shot</b><span>Tracker</span></div>
    <h2>Добро пожаловать в тир</h2>
    <p>Свои сессии, заметки о ветре и погоде, шаги по выстрелам. Чужие сессии другим людям не видны.</p>
  </section>
  <form class="card" id="form">
    <h1 class="card-title">Регистрация</h1>
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
    <label for="password2">Пароль ещё раз</label>
    <input id="password2" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
    <button id="submit" type="submit">Создать и войти</button>
    <p class="error" id="error"></p>
    <p class="switch">Уже есть логин? <a href="/login">Вход</a></p>
  </form>
  <script>
    const form = document.getElementById("form")
    const error = document.getElementById("error")
    const button = document.getElementById("submit")
    form.addEventListener("submit", async (event) => {
      event.preventDefault()
      error.textContent = ""
      const password = document.getElementById("password").value
      if (password !== document.getElementById("password2").value) {
        error.textContent = "Пароли не совпадают"
        return
      }
      button.disabled = true
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password,
          }),
        })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) {
          error.textContent = data.detail || "Не удалось зарегистрироваться"
          return
        }
        location.href = "/app"
      } catch {
        error.textContent = "Сервер не ответил"
      } finally {
        button.disabled = false
      }
    })
  </script>
</body>
</html>
